<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Collections & Stitching — MISRI CLOTH</title></head><body><p>Explore <a href="collections.html">Collections</a> or <a href="stitching.html">Stitching</a>.</p><script src="js/catalog.js"></script><script>
(async () => {
const params = new URLSearchParams(location.search);
const category = params.get('category');
let categories = MisriCatalog.categories;
try { const response = await fetch('/api/catalog-categories'); const data = await response.json(); if (response.ok && data.success) categories = data.categories; } catch (_) {}
const stitching = categories.stitching.some(item => item.id === category) || location.hash === '#measurements';
if (category === 'fabric') params.delete('category');
location.replace((stitching ? 'stitching.html' : 'collections.html') + (params.size ? '?' + params.toString() : '') + location.hash);
})();
</script></body></html>
